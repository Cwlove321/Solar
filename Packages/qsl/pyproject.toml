[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-qsl"
version = "0.1.0"
description = "Python wrapper for the CPU/OpenMP FastQSL squashing-factor solver"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
qsl = ["bin/qfactor.x"]
